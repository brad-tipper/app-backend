---
Name: app-backend-routes
Before: '*'
---
SilverStripe\Control\Director:
  rules:
    'api/v1/health': BradTipper\AppBackend\Api\HealthController
    'api/v1/auth//$Action/$ID/$OtherID': BradTipper\AppBackend\Auth\AuthController
    'api/v1/contact': BradTipper\AppBackend\Account\ContactController
    'api/v1/feedback': BradTipper\AppBackend\Account\FeedbackController
    'api/v1/tickets//$Action/$ID': BradTipper\AppBackend\Account\TicketsController
    'api/v1/account//$Action': BradTipper\AppBackend\Account\AccountController
    'api/v1/webhooks/revenuecat': BradTipper\AppBackend\Account\RevenueCatWebhookController
    'api/v1/_e2e/seed': BradTipper\AppBackend\Testing\E2eSeedController
---
Name: app-backend-middleware
---
SilverStripe\Core\Injector\Injector:
  SilverStripe\Control\Director:
    properties:
      Middlewares:
        AppBackendCors: '%$BradTipper\AppBackend\Api\CorsMiddleware'
---
Name: app-backend-passwords
After: '#corepasswords'
---
# Matches the client-side rule: 12+ characters with lower, upper, digit and symbol.
SilverStripe\Core\Injector\Injector:
  SilverStripe\Security\Validation\PasswordValidator:
    class: SilverStripe\Security\Validation\RulesPasswordValidator
SilverStripe\Security\Validation\RulesPasswordValidator:
  min_length: 12
  min_test_score: 4
---
Name: app-backend-member
---
BradTipper\AppBackend\Model\Ticket:
  extensions:
    - BradTipper\AppBackend\Sync\SyncedExtension
SilverStripe\Security\Member:
  extensions:
    - BradTipper\AppBackend\Auth\ApiMemberExtension
    - BradTipper\AppBackend\Admin\MemberAdminExtension
  lock_out_after_incorrect_logins: 10
  lock_out_delay_mins: 15
  defaults:
    Timezone: 'Pacific/Auckland'
    DisplayDateFormat: 'en-NZ'
    Units: 'metric'
BradTipper\AppBackend\Auth\SessionService:
  access_ttl: 3600
  refresh_ttl: 5184000
  require_email_confirmation: false
BradTipper\AppBackend\Account\AccountController:
  deletion_grace_days: 30
BradTipper\AppBackend\Account\RevenueCatWebhookController:
  environment: PRODUCTION
  entitlement_ids:
    - pro
  product_ids: []
---
Name: app-backend-jobs
---
Symbiote\QueuedJobs\DataObjects\QueuedJobDescriptor:
  extensions:
    - BradTipper\AppBackend\Jobs\SchedulerExtension
BradTipper\AppBackend\Jobs\Scheduler:
  jobs:
    - BradTipper\AppBackend\Account\ProcessAccountDeletionsJob
---
Name: app-backend-branding
---
SilverStripe\SiteConfig\SiteConfig:
  extensions:
    - BradTipper\AppBackend\Support\SiteConfigBrandExtension

---
Name: app-backend-cache
After:
  - '#requestprocessors'
---
# PSR-16 cache for the app (Silverstripe's CacheFactory; filesystem under silverstripe-cache), and the page cache
# middleware that uses it. The page cache is on for `live` only; set `AppCache: enabled: true` to try it locally.
SilverStripe\Core\Injector\Injector:
  Psr\SimpleCache\CacheInterface.appBackend:
    factory: SilverStripe\Core\Cache\CacheFactory
    constructor:
      namespace: 'appBackend'
      defaultLifetime: 86400
      # Not the versioned-stage proxy (keys would differ between the middleware and the controller), and no in-process
      # APCu layer (a bump from a CLI task or queued job must be seen by the web workers).
      disable-container: true
      useInMemoryCache: false
  SilverStripe\Control\Director:
    properties:
      Middlewares:
        AppBackendPageCache: '%$BradTipper\AppBackend\Cache\PageCacheMiddleware'
---
Name: app-backend-cache-live
Only:
  environment: live
---
BradTipper\AppBackend\Cache\AppCache:
  enabled: true
---
Name: app-backend-cache-cms
Only:
  classexists: 'SilverStripe\CMS\Model\SiteTree'
---
# Anything edited in the CMS that shows on the public site busts the page cache.
SilverStripe\CMS\Model\SiteTree:
  extensions:
    - BradTipper\AppBackend\Cache\BustsSiteCache
SilverStripe\SiteConfig\SiteConfig:
  extensions:
    - BradTipper\AppBackend\Cache\BustsSiteCache
---
Name: app-backend-cache-elemental
Only:
  classexists: 'DNADesign\Elemental\Models\BaseElement'
---
DNADesign\Elemental\Models\BaseElement:
  extensions:
    - BradTipper\AppBackend\Cache\BustsSiteCache
