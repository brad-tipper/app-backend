---
Name: app-backend-routes
Before: '*'
---
SilverStripe\Control\Director:
  rules:
    'v1/health': BradTipper\AppBackend\Api\HealthController
    'v1/auth//$Action/$ID/$OtherID': BradTipper\AppBackend\Auth\AuthController
    'v1/contact': BradTipper\AppBackend\Account\ContactController
    'v1/feedback': BradTipper\AppBackend\Account\FeedbackController
    'v1/account//$Action': BradTipper\AppBackend\Account\AccountController
    'v1/webhooks/revenuecat': BradTipper\AppBackend\Account\RevenueCatWebhookController
---
Name: app-backend-middleware
---
SilverStripe\Core\Injector\Injector:
  SilverStripe\Control\Director:
    properties:
      Middlewares:
        AppBackendCors: '%$BradTipper\AppBackend\Api\CorsMiddleware'
---
Name: app-backend-passwords
After: '#corepasswords'
---
# Matches the client-side rule: 12+ characters with lower, upper, digit and symbol.
SilverStripe\Core\Injector\Injector:
  SilverStripe\Security\Validation\PasswordValidator:
    class: SilverStripe\Security\Validation\RulesPasswordValidator
SilverStripe\Security\Validation\RulesPasswordValidator:
  min_length: 12
  min_test_score: 4
---
Name: app-backend-member
---
SilverStripe\Security\Member:
  extensions:
    - BradTipper\AppBackend\Auth\ApiMemberExtension
  lock_out_after_incorrect_logins: 10
  lock_out_delay_mins: 15
  defaults:
    Timezone: 'Pacific/Auckland'
    DisplayDateFormat: 'en-NZ'
    Units: 'metric'
BradTipper\AppBackend\Auth\SessionService:
  access_ttl: 3600
  refresh_ttl: 5184000
  require_email_confirmation: false
  # Origins a client may name as `redirectUrl` in emailed links (also APP_REDIRECT_ORIGINS).
  allowed_redirect_origins: []
BradTipper\AppBackend\Account\AccountController:
  deletion_grace_days: 30
BradTipper\AppBackend\Account\RevenueCatWebhookController:
  environment: PRODUCTION
  entitlement_ids:
    - pro
  product_ids: []
